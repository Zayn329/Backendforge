<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend Forge — Backend Engineering Learning Platform</title>
    <meta
      name="description"
      content="Personal backend engineering learning platform with First Principles Thinking, Recipe Mode, and Syntax Mode."
    />
    <meta property="og:title" content="Backend Forge" />
    <meta
      property="og:description"
      content="Personal backend engineering learning platform with First Principles Thinking, Recipe Mode, and Syntax Mode."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('backend_forge_v1');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && (parsed.settings.theme === 'light' || parsed.settings.theme === 'dark')) {
              theme = parsed.settings.theme;
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B0E14] dark:text-slate-100 antialiased selection:bg-blue-600/20 selection:text-blue-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
